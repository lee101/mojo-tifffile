[project]
name = "mojo-tifffile"
version = "0.1.0"
description = "TIFF read and write with Mojo-accelerated codecs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "tiff", "image", "codec"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "tifffile", "imagecodecs"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-tifffile"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
